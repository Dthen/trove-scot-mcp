[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trove-scot-mcp"
version = "0.3.0"
description = "MCP server for Scotland's historic environment via Historic Environment Scotland (trove.scot)"
readme = "README.md"
license = {text = "0BSD"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
